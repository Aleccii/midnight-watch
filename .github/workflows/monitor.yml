name: Midnight Watch monitors
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Catalog sync + live verification
        run: python monitors/sync_catalog.py
      - name: Availability scan for non-synced rows
        run: python monitors/check_availability.py
      - name: Daily appearance scan
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        run: python monitors/check_appearances.py
      - name: Save cover images
        run: python monitors/fetch_covers.py
      - name: Rebuild index.html
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "midnight-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json index.html covers monitors/.appearance_state.json monitors/.catalog_cache.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%FT%TZ)"
          git push
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - uses: actions/deploy-pages@v4
